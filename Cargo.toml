[workspace]
members = [
    "crates/hotstore-core",
    "crates/hotstore-db",
    "crates/hotstore-ingest",
    "crates/hotstore-sui-source",
    "crates/hotstore-api",
    "crates/hotstore-bench",
    "crates/hotstore-admin",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.75"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
bincode = "1.3"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rocksdb = { version = "0.22.0", default-features = false, features = ["multi-threaded-cf"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.23"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread"] }

[patch.crates-io]
rocksdb = { git = "https://github.com/topling/rust-toplingdb" }
